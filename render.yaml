# Blueprint Render : API + PostgreSQL + Redis (Key Value). Voir docs/05-deploiement-cloudflare.md
# Le site (React) est déployé séparément sur Cloudflare Pages et relaie /api vers cette API.
services:
  - type: web
    name: nexbridge-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free                  # démo : mise en veille après inactivité ; passer à « starter » pour un service toujours actif
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging            # « production » exige DEMO_MODE=false et des secrets stables ; voir le guide
      - key: DEMO_MODE
        value: "true"             # bandeau « données de démonstration » + seed autorisé ; passer à false pour de vraies données
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "2"
      - key: APP_URL
        sync: false               # URL publique du site Cloudflare Pages, ex. https://nexbridge.pages.dev
      - key: DATABASE_URL
        fromDatabase: { name: nexbridge-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: nexbridge-redis, property: connectionString }
      - key: ENCRYPTION_KEY
        generateValue: true       # 32 octets aléatoires (base64) : ne jamais le changer ensuite
      - key: JWT_PRIVATE_KEY
        sync: false               # voir le guide (openssl genpkey)
      - key: JWT_PUBLIC_KEY
        sync: false
  - type: keyvalue
    name: nexbridge-redis
    plan: free
    region: frankfurt
    ipAllowList: []               # accès interne uniquement
databases:
  - name: nexbridge-db
    plan: free                    # démo : la base gratuite expire après ~30 jours ; passer à « basic-256mb » pour la conserver
    region: frankfurt
