# NEXBRIDGE sur Netlify : site statique (apps/web) + API (netlify/server) + base Netlify Database.
[build]
  command = "DATABASE_URL=postgresql://build:build@localhost/build pnpm --filter @nexbridge/api exec prisma generate && pnpm --filter @nexbridge/web build && pnpm --filter @nexbridge/api run build:netlify"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

# Pages du site (SPA) : réécrites vers index.html. L'API (/api/*, /socket.io/*) est servie par netlify/server.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

